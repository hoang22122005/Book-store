spring:
  application:
    name: bookstore

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:bookstore_backend/.env[.properties]
      - optional:file:bookstore_backend/.env.local[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 600000
      data-source-properties:
        sslmode: require

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    ignore-migration-patterns: "*:missing"
  
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:604800000} # 7 ngay

vnpay:
  tmn-code: ${VNP_TMN_CODE:${VNPAY_TMN_CODE:}}
  hash-secret: ${VNP_HASH_SECRET:${VNPAY_HASH_SECRET:}}
  payment-url: ${VNP_URL:${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}}
  return-url: ${VNP_RETURN_URL:${VNPAY_RETURN_URL:https://frontend.sachhay.click/order-success}}
  expire-minutes: ${VNPAY_EXPIRE_MINUTES:10}

app:
  frontend:
    url: ${FRONTEND_URL:https://frontend.sachhay.click}
  refresh-token:
    expiration-days: ${REFRESH_TOKEN_EXPIRATION_DAYS:7}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://127.0.0.1:5173,https://sachhay.click,https://frontend.sachhay.click,https://www.sachhay.click,https://*.sachhay.click}



payment:
  expiry-check-delay-ms: ${PAYMENT_EXPIRY_CHECK_DELAY_MS:60000}

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

logging:
  file:
    name: logs/bookstore-backend.log
  logback:
    rollingpolicy:
      file-name-pattern: logs/bookstore-backend.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 10MB
      max-history: 14
  level:
    root: INFO
    com.bookstore: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
